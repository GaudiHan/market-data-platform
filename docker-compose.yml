services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: mdp_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TSDB_USER:-mdp}
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-mdp_local_pw}
      POSTGRES_DB: ${TSDB_DB:-marketdata}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./infra/timescale-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TSDB_USER:-mdp} -d ${TSDB_DB:-marketdata}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: mdp_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mdp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mdp_local_pw}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-marketdata}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timescale_data:
  mongo_data:
